<!-- Portfolio Grid -->
<section class="page-section" id="{{ site.data.sitetext.portfolio.section | default: "portfolio" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ site.data.sitetext[site.locale].portfolio.title | markdownify | default: "Portfolio" }}</h2>
        {% if site.data.sitetext[site.locale].portfolio.text %}
          <h3 class="section-subheading text-muted" style=" margin-bottom: 15px;">{{ site.data.sitetext[site.locale].portfolio.text }}</h3>
		  {% endif %}
      </div>
    </div>

    <div class="row">
      <div class="col-md-9">
        <video width="100%" height="100%" controls="false" autoplay loop="true" muted>
          <source src="assets/DemoReel.mp4" type="video/mp4">
        </video>
      </div>
    </div>

  </div>
</section>
{% include modals.html %}
