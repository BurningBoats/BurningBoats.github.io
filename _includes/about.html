<!-- About -->
<section class="page-section" id="{{ site.data.sitetext[site.locale].about.section | default: "about" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ site.data.sitetext[site.locale].about.title | default: "About Us" }}</h2>
        <h3 class="section-subheading text-muted" style="margin-bottom: 30px">{{ site.data.sitetext[site.locale].about.text | default: "" }}</h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 mx-auto text-center" style="margin-bottom: 40px">
        <div class="large text-muted">{{ site.data.sitetext[site.locale].about.body | markdownify }}</div>
      </div>
    </div>
  </div>
</section>
<div style="background-color: #fffaf1; padding: 40px;"">
  <div class="row" style="justify-content: space-around">
    <img src="assets/img/team/1.png" alt="Avatar" style="border-radius: 50%;" width="300" height="300">
    <img src="assets/img/team/2.png" alt="Avatar" style="border-radius: 50%;" width="300" height="300">
    <img src="assets/img/team/3.png" alt="Avatar" style="border-radius: 50%;" width="300" height="300">
  </div>
  <div class="row justify-content-center" >
    <img src="assets/img/team/4.png" alt="Avatar" style="border-radius: 50%;" width="300" height="300">
    <img src="assets/img/team/5.png" alt="Avatar" style="border-radius: 50%;" width="300" height="300">
    <img src="assets/img/team/6.png" alt="Avatar" style="border-radius: 50%;" width="300" height="300">
  </div>
</div>
<!-- End About -->
