<!-- About -->
<section class="page-section" id="{{ site.data.sitetext[site.locale].about.section | default: "about" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ site.data.sitetext[site.locale].about.title | default: "About Us" }}</h2>
        <h3 class="section-subheading text-muted" style="margin-bottom: 30px">{{ site.data.sitetext[site.locale].about.text | default: "" }}</h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 mx-auto text-center" style="margin-bottom: 40px">
        <div class="large text-muted">{{ site.data.sitetext[site.locale].about.body | markdownify }}</div>
      </div>
    </div>
  </div>
</section>
<div style="background-color: #fffaf1;">
  <div class="row" >
    <img src="assets/img/team/img_test.png" alt="Avatar" style="border-radius: 50%">
    <img src="assets/img/team/img_test.png" alt="Avatar" style="border-radius: 50%">
    <img src="assets/img/team/img_test.png" alt="Avatar" style="border-radius: 50%">
  </div>
</div>
<!-- End About -->
