name: Build & deploy → new-pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish dist/ to the new-pages branch (GitHub Pages source)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy-new-pages
  cancel-in-progress: false

env:
  # Launch gate: while "false", pushes to main only build + verify (no publish).
  # Flip to "true" at launch so every push to main goes live on new-pages.
  AUTO_PUBLISH: "false"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore Astro asset cache
        uses: actions/cache@v6
        with:
          path: .cache/astro
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - name: Type & content check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Size budgets
        run: npm run budgets

      - name: Locale & SEO checklist
        run: node scripts/check-locales.mjs

      - name: Sanity-check critical outputs
        run: |
          for f in index.html 404.html es/index.html pt/index.html sitemap-index.xml robots.txt .nojekyll; do
            test -f "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
          echo "dist OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

      - name: Publish to new-pages
        if: ${{ (github.event_name == 'push' && env.AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: new-pages
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "deploy: ${{ github.sha }}"
